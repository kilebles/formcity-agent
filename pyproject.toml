[project]
name = "formcity-bot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.27.0",
    "aiohttp-socks>=0.11.0",
    "beautifulsoup4>=4.14.3",
    "fastexcel>=0.19.0",
    "httpx>=0.28.1",
    "loguru>=0.7.3",
    "openai>=2.31.0",
    "openpyxl>=3.1.5",
    "polars>=1.39.3",
    "pydantic-settings>=2.13.1",
    "redis>=7.4.0",
    "tavily-python>=0.7.23",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
